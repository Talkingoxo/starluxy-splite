name: Publish Fedora 44 LABWC offline repositories

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-fedora44-labwc.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-fedora44-labwc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Build Fedora 44 repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          docker run --rm \
            -v "$PWD/out:/out" \
            fedora:44 \
            bash -euo pipefail -c '
              dnf5 -y install dnf5-plugins createrepo_c tar xz

              rm -rf /work
              mkdir -p \
                /work/labwc/repo/rpms \
                /work/labwc/manifest \
                /work/xwayland/repo/rpms \
                /work/xwayland/manifest

              dnf5 download \
                --resolve \
                --alldeps \
                --destdir=/work/labwc/repo/rpms \
                labwc labwc-session

              dnf5 download \
                --resolve \
                --alldeps \
                --destdir=/work/xwayland/repo/rpms \
                xorg-x11-server-Xwayland

              createrepo_c /work/labwc/repo
              createrepo_c /work/xwayland/repo

              (
                cd /work/labwc
                sha256sum repo/rpms/*.rpm > manifest/RPMS.sha256
                rpm -qp --qf "%{NAME} %{VERSION}-%{RELEASE}.%{ARCH}\n" \
                  repo/rpms/*.rpm | sort > manifest/PACKAGES.txt
              )

              (
                cd /work/xwayland
                sha256sum repo/rpms/*.rpm > manifest/RPMS.sha256
                rpm -qp --qf "%{NAME} %{VERSION}-%{RELEASE}.%{ARCH}\n" \
                  repo/rpms/*.rpm | sort > manifest/PACKAGES.txt
              )

              tar -cJf /out/fedora44-labwc-repository.tar.xz \
                -C /work/labwc .
              tar -cJf /out/fedora44-xwayland-offline-repository.tar.xz \
                -C /work/xwayland .
            '

          (
            cd out
            sha256sum \
              fedora44-labwc-repository.tar.xz \
              fedora44-xwayland-offline-repository.tar.xz \
              > SHA256SUMS
          )

          test -s out/fedora44-labwc-repository.tar.xz
          test -s out/fedora44-xwayland-offline-repository.tar.xz
          cat out/SHA256SUMS

      - name: Publish fixed release files
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=fedora44-labwc-offline-v1

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Fedora 44 LABWC offline repositories" \
              --notes "Verified Fedora 44 LABWC, LABWC session and Xwayland offline repositories."
          fi

          gh release upload "$TAG" \
            out/fedora44-labwc-repository.tar.xz \
            out/fedora44-xwayland-offline-repository.tar.xz \
            out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
