name: Temporary VM artifact transfer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - name: Reconstruct exact committed TinyCore ISO
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p transfer/qemu-debs
          BASE='https://testing-ff9x-git-tinycore-vm-bootstrap-alexs-projects-d77c3382.vercel.app/api/bootstrap-file'
          META=$(curl -fsSL "$BASE?name=iso&meta=1")
          SIZE=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["size"])' <<<"$META")
          OUT=transfer/TinyCore-Modern-Pure64.iso
          : > "$OUT"
          CHUNK=$((2*1024*1024))
          OFFSET=0
          while [ "$OFFSET" -lt "$SIZE" ]; do
            LENGTH=$CHUNK
            if [ $((OFFSET + LENGTH)) -gt "$SIZE" ]; then LENGTH=$((SIZE - OFFSET)); fi
            curl -fsSL "$BASE?name=iso&offset=$OFFSET&length=$LENGTH" | base64 -d >> "$OUT"
            OFFSET=$((OFFSET + LENGTH))
          done
          test "$(stat -c %s "$OUT")" -eq "$SIZE"
          echo '82db77b13dd13633a82fa600dc224957cd0a750fa948fe121c115fb438045dac  transfer/TinyCore-Modern-Pure64.iso' | sha256sum -c -
          sha256sum "$OUT" > transfer/TinyCore-Modern-Pure64.iso.sha256

      - name: Download complete Debian 13 QEMU package set
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm -v "$PWD/transfer/qemu-debs:/out" debian:trixie-slim bash -lc '
            set -eux
            apt-get update
            apt-get install -y --no-install-recommends --download-only \
              qemu-system-x86 qemu-utils qemu-system-common qemu-system-data \
              seabios ipxe-qemu fdisk
            cp -v /var/cache/apt/archives/*.deb /out/
          '
          (cd transfer/qemu-debs && sha256sum *.deb > SHA256SUMS)
          du -sh transfer transfer/qemu-debs

      - name: Upload VM transfer bundle
        uses: actions/upload-artifact@v4
        with:
          name: tinycore-qemu-offline-bundle
          path: transfer/
          retention-days: 1
          compression-level: 0
