name: Temporary official Fedora minimal installer transfer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verify and split official Fedora Server DVD
        shell: bash
        run: |
          set -euxo pipefail
          ISO='Fedora-Server-dvd-x86_64-44-1.7.iso'
          CHECKSUM='Fedora-Server-44-1.7-x86_64-CHECKSUM'
          BASE='https://download.fedoraproject.org/pub/fedora/linux/releases/44/Server/x86_64/iso'
          mkdir -p transfer/manifest transfer/parts
          cd transfer
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$ISO" "$BASE/$ISO"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "manifest/$CHECKSUM" "$BASE/$CHECKSUM"
          curl --fail --location --retry 5 --retry-all-errors \
            --output manifest/fedora.gpg https://fedoraproject.org/fedora.gpg
          gpgv --keyring ./manifest/fedora.gpg \
            --output manifest/VERIFIED-CHECKSUM "manifest/$CHECKSUM"
          sha256sum -c --ignore-missing manifest/VERIFIED-CHECKSUM
          sha256sum "$ISO" > manifest/ISO.sha256
          stat -c '%n %s bytes' "$ISO" | tee manifest/ISO.stat
          split --bytes=480M --numeric-suffixes=0 --suffix-length=2 \
            "$ISO" "parts/$ISO.part-"
          sha256sum parts/* > manifest/PARTS.sha256
          stat -c '%n %s bytes' parts/* | tee manifest/PARTS.stat
          test "$(find parts -maxdepth 1 -type f | wc -l)" -eq 8
          rm "$ISO"

      - name: Upload Fedora installer part 00
        uses: actions/upload-artifact@v4
        with:
          name: fedora-server-44-dvd-part-00
          path: transfer/parts/Fedora-Server-dvd-x86_64-44-1.7.iso.part-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Fedora installer part 01
        uses: actions/upload-artifact@v4
        with:
          name: fedora-server-44-dvd-part-01
          path: transfer/parts/Fedora-Server-dvd-x86_64-44-1.7.iso.part-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Fedora installer part 02
        uses: actions/upload-artifact@v4
        with:
          name: fedora-server-44-dvd-part-02
          path: transfer/parts/Fedora-Server-dvd-x86_64-44-1.7.iso.part-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Fedora installer part 03
        uses: actions/upload-artifact@v4
        with:
          name: fedora-server-44-dvd-part-03
          path: transfer/parts/Fedora-Server-dvd-x86_64-44-1.7.iso.part-03
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Fedora installer part 04
        uses: actions/upload-artifact@v4
        with:
          name: fedora-server-44-dvd-part-04
          path: transfer/parts/Fedora-Server-dvd-x86_64-44-1.7.iso.part-04
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Fedora installer part 05
        uses: actions/upload-artifact@v4
        with:
          name: fedora-server-44-dvd-part-05
          path: transfer/parts/Fedora-Server-dvd-x86_64-44-1.7.iso.part-05
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Fedora installer part 06
        uses: actions/upload-artifact@v4
        with:
          name: fedora-server-44-dvd-part-06
          path: transfer/parts/Fedora-Server-dvd-x86_64-44-1.7.iso.part-06
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Fedora installer part 07
        uses: actions/upload-artifact@v4
        with:
          name: fedora-server-44-dvd-part-07
          path: transfer/parts/Fedora-Server-dvd-x86_64-44-1.7.iso.part-07
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Fedora installer verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: fedora-server-44-dvd-manifest
          path: transfer/manifest/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
