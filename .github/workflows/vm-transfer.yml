name: Temporary official Fedora Cloud image transfer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and verify official Fedora Cloud Base image
        shell: bash
        run: |
          set -euxo pipefail
          IMAGE='Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2'
          CHECKSUM='Fedora-Cloud-44-1.7-x86_64-CHECKSUM'
          BASE='https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images'
          EXPECTED='28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f'
          mkdir -p transfer
          cd transfer
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$IMAGE" "$BASE/$IMAGE"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$CHECKSUM" "$BASE/$CHECKSUM"
          curl --fail --location --retry 5 --retry-all-errors \
            --output fedora.gpg https://fedoraproject.org/fedora.gpg
          gpgv --keyring ./fedora.gpg --output VERIFIED-CHECKSUM "$CHECKSUM"
          sha256sum -c --ignore-missing VERIFIED-CHECKSUM
          printf '%s  %s\n' "$EXPECTED" "$IMAGE" | sha256sum -c -
          sha256sum "$IMAGE" > "$IMAGE.sha256"
          stat -c '%n %s bytes' "$IMAGE"

      - name: Upload verified official Fedora image
        uses: actions/upload-artifact@v4
        with:
          name: fedora-cloud-base-44-x86_64
          path: transfer/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
