name: Inspect Fedora 44 Everything software environments

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Read official Fedora comps metadata
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd
          BASE='https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os'
          mkdir -p output
          curl --fail --location --retry 5 --retry-all-errors \
            --output output/repomd.xml "$BASE/repodata/repomd.xml"
          HREF=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('output/repomd.xml').getroot()
          ns={'r':'http://linux.duke.edu/metadata/repo'}
          for kind in ('group','group_gz'):
              node=root.find(f"r:data[@type='{kind}']/r:location",ns)
              if node is not None:
                  print(node.attrib['href'])
                  break
          else:
              raise SystemExit('No comps/group metadata in repomd.xml')
          PY
          )
          echo "$HREF" | tee output/comps-location.txt
          curl --fail --location --retry 5 --retry-all-errors \
            --output output/comps.xml.zst "$BASE/$HREF"
          zstd -dc output/comps.xml.zst > output/comps.xml
          python3 - <<'PY' | tee output/environments.txt
          import xml.etree.ElementTree as ET
          root=ET.parse('output/comps.xml').getroot()
          for env in root.findall('environment'):
              env_id=env.findtext('id')
              name=env.findtext('name')
              groups=[n.text for n in env.findall('./grouplist/groupid')]
              options=[n.text for n in env.findall('./optionlist/groupid')]
              print(f'ID={env_id}\nNAME={name}\nGROUPS={groups}\nOPTIONS={options}\n')
          PY
          grep -in -A8 -B2 'minimal' output/environments.txt \
            | tee output/minimal-matches.txt || true

      - name: Upload Fedora environment metadata
        uses: actions/upload-artifact@v4
        with:
          name: fedora44-everything-environments
          path: output/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
