name: Build Fedora Everything 44 Minimal Install VM

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Prepare builder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils libarchive-tools openssh-client netcat-openbsd
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          mkdir -p work/{iso,boot,http,keys,logs} transfer/{manifest,parts}

      - name: Verify Fedora Everything 44 Network Install ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO=Fedora-Everything-netinst-x86_64-44-1.7.iso
          SUM=Fedora-Everything-44-1.7-x86_64-CHECKSUM
          BASE=https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/iso
          curl -fL --retry 5 --retry-all-errors -o work/iso/$ISO $BASE/$ISO
          curl -fL --retry 5 --retry-all-errors -o work/iso/$SUM $BASE/$SUM
          curl -fL --retry 5 --retry-all-errors -o work/iso/fedora.gpg https://fedoraproject.org/fedora.gpg
          (cd work/iso && gpgv --keyring ./fedora.gpg --output VERIFIED-CHECKSUM $SUM && \
            sha256sum -c --ignore-missing VERIFIED-CHECKSUM && sha256sum $ISO) \
            | tee transfer/manifest/INSTALLER-VERIFICATION.txt
          bsdtar -xf work/iso/$ISO -C work/boot images/pxeboot/vmlinuz images/pxeboot/initrd.img
          blkid -p -s LABEL -o value work/iso/$ISO > work/iso/LABEL

      - name: Define core-only Minimal Install
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -C fedora-minimal -f work/keys/fedora_minimal_ed25519
          chmod 600 work/keys/fedora_minimal_ed25519
          PUB=$(cat work/keys/fedora_minimal_ed25519.pub)
          cat > work/http/ks.cfg <<EOF
          text
          eula --agreed
          url --url=https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/
          lang en_US.UTF-8
          keyboard us
          timezone Etc/UTC --utc
          network --bootproto=dhcp --device=link --activate --hostname=fedora-minimal
          rootpw --lock
          user --name=fedora --groups=wheel --lock
          sshkey --username=fedora "$PUB"
          firewall --enabled --service=ssh
          selinux --enforcing
          services --enabled=sshd,NetworkManager
          firstboot --disable
          skipx
          zerombr
          ignoredisk --only-use=vda
          clearpart --all --initlabel --drives=vda
          autopart --type=lvm
          bootloader --location=mbr --append="console=tty0 console=ttyS0,115200n8"
          shutdown

          %packages --excludedocs --inst-langs=en_US
          @core
          fedora-release-identity-basic
          rpm
          dnf5
          selinux-policy-targeted
          policycoreutils
          NetworkManager
          openssh-server
          sudo
          -fedora-release-server
          -fedora-release-identity-server
          -fedora-release-cloud
          -fedora-release-identity-cloud
          -cloud-init
          -rpm-ostree
          -ostree
          -gnome-shell
          -gdm
          -plasma-desktop
          -sddm
          -xorg-x11-server-Xorg
          %end

          %post
          printf 'fedora ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/fedora
          chmod 0440 /etc/sudoers.d/fedora
          printf 'fedora-everything-core-installed\n' > /var/tmp/fedora-minimal-install-marker
          systemctl set-default multi-user.target
          %end
          EOF
          sed -E '/^(sshkey|rootpw|user )/d' work/http/ks.cfg > transfer/manifest/ks-redacted.cfg

      - name: Install with Anaconda
        shell: bash
        run: |
          set -euo pipefail
          qemu-img create -f qcow2 work/fedora44-minimal.qcow2 20G
          python3 -m http.server 8000 --bind 0.0.0.0 --directory work/http >work/logs/http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          LABEL=$(cat work/iso/LABEL)
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL='-accel kvm -cpu host'; else ACCEL='-accel tcg,thread=multi -cpu max'; fi
          set +e
          timeout --foreground 10800 qemu-system-x86_64 $ACCEL -machine pc -m 4096M -smp 2 \
            -drive file=work/fedora44-minimal.qcow2,if=virtio,format=qcow2,cache=writeback \
            -drive file=work/iso/Fedora-Everything-netinst-x86_64-44-1.7.iso,media=cdrom,readonly=on \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 -device virtio-rng-pci \
            -kernel work/boot/images/pxeboot/vmlinuz -initrd work/boot/images/pxeboot/initrd.img \
            -append "inst.stage2=hd:LABEL=$LABEL inst.repo=https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/ inst.ks=http://10.0.2.2:8000/ks.cfg inst.cmdline console=ttyS0,115200n8 ip=dhcp rd.neednet=1" \
            -nographic -monitor none -no-reboot >work/logs/install-console.log 2>work/logs/install-stderr.log
          STATUS=$?
          set -e
          kill $HTTP_PID 2>/dev/null || true
          trap - EXIT
          cp work/logs/install-* transfer/manifest/ || true
          test $STATUS -eq 0
          if grep -Eiq 'installation was stopped due to an error|installer will now terminate|No match for argument|mandatory spokes are not completed|software selection.*incomplete' work/logs/install-console.log; then
            tail -300 work/logs/install-console.log
            exit 1
          fi
          qemu-img check work/fedora44-minimal.qcow2 | tee transfer/manifest/POST-INSTALL-DISK-CHECK.txt

      - name: Boot and verify twice
        shell: bash
        run: |
          set -euo pipefail
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL='-accel kvm -cpu host'; else ACCEL='-accel tcg,thread=multi -cpu max'; fi
          boot_vm() {
            rm -f work/qemu.pid
            qemu-system-x86_64 $ACCEL -machine pc -m 2048M -smp 2 \
              -drive file=work/fedora44-minimal.qcow2,if=virtio,format=qcow2,cache=writeback \
              -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n0 \
              -device virtio-rng-pci -display none -serial file:$1 -monitor none -no-reboot \
              -daemonize -pidfile work/qemu.pid
            for i in $(seq 1 360); do
              nc -z 127.0.0.1 2222 && return 0
              kill -0 $(cat work/qemu.pid) 2>/dev/null || { tail -200 $1; return 1; }
              sleep 2
            done
            tail -200 $1
            return 1
          }
          SSH="ssh -i work/keys/fedora_minimal_ed25519 -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 fedora@127.0.0.1"
          CHECK='set -e; cat /etc/fedora-release; test "$(systemctl get-default)" = multi-user.target; rpm -q fedora-release-identity-basic; ! rpm -q fedora-release-server; ! rpm -q fedora-release-identity-server; ! rpm -q fedora-release-cloud; ! rpm -q fedora-release-identity-cloud; command -v rpm; command -v dnf5; dnf5 --version; test "$(getenforce)" = Enforcing; test "$(cat /sys/fs/selinux/enforce)" = 1; rpm -q selinux-policy-targeted; ! command -v rpm-ostree; ! rpm -q rpm-ostree; ! rpm -q cloud-init; for p in gnome-shell gdm plasma-desktop sddm xorg-x11-server-Xorg; do ! rpm -q "$p"; done; systemctl is-active sshd; test -f /var/tmp/fedora-minimal-install-marker'
          boot_vm work/logs/boot-1.log
          ID1=$($SSH 'cat /proc/sys/kernel/random/boot_id')
          $SSH "$CHECK; sudo sh -c 'echo persistence-ok > /var/tmp/fedora-minimal-persistence-marker'; findmnt /; df -h /; rpm -qa | wc -l" | tee transfer/manifest/FIRST-BOOT.txt
          echo $ID1 > transfer/manifest/FIRST-BOOT-ID
          $SSH 'sudo systemctl poweroff' || true
          for i in $(seq 1 180); do kill -0 $(cat work/qemu.pid) 2>/dev/null || break; sleep 1; done
          ! kill -0 $(cat work/qemu.pid) 2>/dev/null
          qemu-img check work/fedora44-minimal.qcow2 | tee transfer/manifest/AFTER-FIRST-BOOT-CHECK.txt
          boot_vm work/logs/boot-2.log
          ID2=$($SSH 'cat /proc/sys/kernel/random/boot_id')
          test "$ID1" != "$ID2"
          $SSH "$CHECK; test \"$(cat /var/tmp/fedora-minimal-persistence-marker)\" = persistence-ok" | tee transfer/manifest/SECOND-BOOT.txt
          echo $ID2 > transfer/manifest/SECOND-BOOT-ID
          $SSH 'sudo systemctl poweroff' || true
          for i in $(seq 1 180); do kill -0 $(cat work/qemu.pid) 2>/dev/null || break; sleep 1; done
          ! kill -0 $(cat work/qemu.pid) 2>/dev/null
          qemu-img check work/fedora44-minimal.qcow2 | tee transfer/manifest/FINAL-DISK-CHECK.txt
          cp work/logs/boot-*.log transfer/manifest/

      - name: Export verified disk
        shell: bash
        run: |
          set -euo pipefail
          qemu-img convert -O qcow2 -c work/fedora44-minimal.qcow2 transfer/fedora44-everything-minimal.qcow2
          qemu-img check transfer/fedora44-everything-minimal.qcow2 | tee transfer/manifest/TRANSFER-DISK-CHECK.txt
          qemu-img info --output=json transfer/fedora44-everything-minimal.qcow2 > transfer/manifest/DISK-INFO.json
          sha256sum transfer/fedora44-everything-minimal.qcow2 > transfer/manifest/DISK.sha256
          split -b 450M -d -a 2 transfer/fedora44-everything-minimal.qcow2 transfer/parts/fedora44-everything-minimal.qcow2.part-
          sha256sum transfer/parts/* > transfer/manifest/PARTS.sha256
          stat -c '%n %s bytes' transfer/parts/* > transfer/manifest/PARTS.stat

      - name: Upload disk part 00
        uses: actions/upload-artifact@v4
        with:
          name: fedora44-everything-minimal-disk-part-00
          path: transfer/parts/fedora44-everything-minimal.qcow2.part-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Upload disk part 01
        uses: actions/upload-artifact@v4
        with:
          name: fedora44-everything-minimal-disk-part-01
          path: transfer/parts/fedora44-everything-minimal.qcow2.part-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload disk part 02
        uses: actions/upload-artifact@v4
        with:
          name: fedora44-everything-minimal-disk-part-02
          path: transfer/parts/fedora44-everything-minimal.qcow2.part-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload disk part 03
        uses: actions/upload-artifact@v4
        with:
          name: fedora44-everything-minimal-disk-part-03
          path: transfer/parts/fedora44-everything-minimal.qcow2.part-03
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedora44-everything-minimal-manifest
          path: transfer/manifest/
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
      - name: Upload access key
        uses: actions/upload-artifact@v4
        with:
          name: fedora44-everything-minimal-access-key
          path: work/keys/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
