name: Build Fedora Everything 44 Minimal Install VM

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils libarchive-tools openssh-client \
            netcat-openbsd zstd dpkg-dev
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          mkdir -p work/iso work/boot work/http work/credentials work/logs \
            transfer/manifest transfer/parts transfer/qemu-debs

      - name: Download and verify Fedora Everything 44 Network Install ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO='Fedora-Everything-netinst-x86_64-44-1.7.iso'
          CHECKSUM='Fedora-Everything-44-1.7-x86_64-CHECKSUM'
          BASE='https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/iso'
          curl --fail --location --retry 5 --retry-all-errors \
            --output "work/iso/$ISO" "$BASE/$ISO"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "work/iso/$CHECKSUM" "$BASE/$CHECKSUM"
          curl --fail --location --retry 5 --retry-all-errors \
            --output work/iso/fedora.gpg https://fedoraproject.org/fedora.gpg
          (
            cd work/iso
            gpgv --keyring ./fedora.gpg --output VERIFIED-CHECKSUM "$CHECKSUM"
            sha256sum -c --ignore-missing VERIFIED-CHECKSUM
            sha256sum "$ISO" > ../../transfer/manifest/INSTALLER.sha256
            stat -c '%n %s bytes' "$ISO" > ../../transfer/manifest/INSTALLER.stat
          )
          bsdtar -xf "work/iso/$ISO" -C work/boot \
            images/pxeboot/vmlinuz images/pxeboot/initrd.img
          blkid -p -s LABEL -o value "work/iso/$ISO" > work/iso/LABEL

      - name: Create Minimal Install kickstart
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -C fedora-minimal \
            -f work/credentials/fedora_minimal_ed25519
          chmod 600 work/credentials/fedora_minimal_ed25519
          PUB=$(cat work/credentials/fedora_minimal_ed25519.pub)
          cat > work/http/ks.cfg <<EOF
          text
          eula --agreed
          url --url=https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/
          lang en_US.UTF-8
          keyboard us
          timezone Etc/UTC --utc
          network --bootproto=dhcp --device=link --activate --hostname=fedora-minimal
          rootpw --lock
          user --name=fedora --groups=wheel --lock
          sshkey --username=fedora "$PUB"
          firewall --enabled --service=ssh
          selinux --enforcing
          services --enabled=sshd,NetworkManager
          firstboot --disable
          skipx
          zerombr
          ignoredisk --only-use=vda
          clearpart --all --initlabel --drives=vda
          autopart --type=lvm
          bootloader --location=mbr --append="console=tty0 console=ttyS0,115200n8"
          shutdown

          %packages --excludedocs --inst-langs=en_US
          @^minimal-environment
          fedora-release-identity-basic
          openssh-server
          sudo
          -fedora-release-server
          -fedora-release-identity-server
          -fedora-release-cloud
          -fedora-release-identity-cloud
          -cloud-init
          -rpm-ostree
          -ostree
          -gnome-shell
          -gdm
          -plasma-desktop
          -sddm
          -xorg-x11-server-Xorg
          %end

          %post
          printf 'fedora ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/fedora
          chmod 0440 /etc/sudoers.d/fedora
          printf 'fedora-everything-minimal-installed\n' > /var/tmp/fedora-minimal-install-marker
          systemctl set-default multi-user.target
          %end
          EOF
          chmod 600 work/http/ks.cfg
          sed -E '/^(sshkey|rootpw|user )/d' work/http/ks.cfg \
            > transfer/manifest/ks-redacted.cfg

      - name: Install Fedora with Anaconda
        shell: bash
        run: |
          set -euo pipefail
          qemu-img create -f qcow2 work/fedora44-minimal.qcow2 20G
          python3 -m http.server 8000 --bind 0.0.0.0 --directory work/http \
            >work/logs/http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID 2>/dev/null || true' EXIT
          LABEL=$(cat work/iso/LABEL)
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=(-accel kvm -cpu host)
            echo kvm > transfer/manifest/INSTALL_ACCELERATOR
          else
            ACCEL=(-accel tcg,thread=multi -cpu max)
            echo tcg > transfer/manifest/INSTALL_ACCELERATOR
          fi
          rm -f work/install-qmp.sock work/install-qemu.pid
          qemu-system-x86_64 \
            "${ACCEL[@]}" \
            -machine pc \
            -m 4096M -smp 2 \
            -drive file=work/fedora44-minimal.qcow2,if=virtio,format=qcow2,cache=writeback \
            -drive file=work/iso/Fedora-Everything-netinst-x86_64-44-1.7.iso,media=cdrom,readonly=on \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -device virtio-rng-pci \
            -kernel work/boot/images/pxeboot/vmlinuz \
            -initrd work/boot/images/pxeboot/initrd.img \
            -append "inst.stage2=hd:LABEL=$LABEL inst.repo=https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/ inst.ks=http://10.0.2.2:8000/ks.cfg inst.cmdline console=ttyS0,115200n8 ip=dhcp rd.neednet=1" \
            -display none -serial file:work/logs/install-console.log -monitor none \
            -qmp unix:work/install-qmp.sock,server=on,wait=off \
            -no-reboot -daemonize -pidfile work/install-qemu.pid \
            2>work/logs/install-stderr.log

          PID=$(cat work/install-qemu.pid)
          MARKER=0
          TIMED_OUT=1
          for i in $(seq 1 10800); do
            if ! kill -0 "$PID" 2>/dev/null; then
              TIMED_OUT=0
              break
            fi
            if grep -Eiq 'Installation complete|Installation finished|The system is ready for use' \
                work/logs/install-console.log 2>/dev/null; then
              MARKER=1
              TIMED_OUT=0
              echo 'Anaconda completion marker detected; flushing before QEMU exit.'
              sleep 30
              python3 - <<'QMP'
          import socket, time
          p='work/install-qmp.sock'
          for _ in range(100):
              try:
                  s=socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  s.connect(p)
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('QMP socket unavailable')
          f=s.makefile('rwb', buffering=0)
          f.readline()
          f.write(b'{"execute":"qmp_capabilities"}\n'); f.readline()
          f.write(b'{"execute":"quit"}\n')
          s.close()
          QMP
              break
            fi
            if [ $((i % 60)) -eq 0 ]; then
              echo "Installer active for ${i}s"
              tail -5 work/logs/install-console.log || true
            fi
            sleep 1
          done

          if [ "$TIMED_OUT" -ne 0 ]; then
            echo 'Installer exceeded three-hour watchdog.'
            tail -300 work/logs/install-console.log || true
            cat work/logs/install-stderr.log || true
            kill "$PID" 2>/dev/null || true
            exit 124
          fi
          for i in $(seq 1 300); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo 'QEMU did not exit after installer completion.'
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          kill "$HTTP_PID" 2>/dev/null || true
          trap - EXIT
          printf 'completion_marker=%s\n' "$MARKER" \
            > transfer/manifest/INSTALL-COMPLETION-STATE
          cp work/logs/install-console.log work/logs/install-stderr.log \
            transfer/manifest/ || true
          sync
          qemu-img check work/fedora44-minimal.qcow2 \
            | tee transfer/manifest/POST-INSTALL-QEMU-IMG-CHECK.txt

      - name: Boot and verify requested Fedora state twice
        shell: bash
        run: |
          set -euo pipefail
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=(-accel kvm -cpu host)
          else
            ACCEL=(-accel tcg,thread=multi -cpu max)
          fi
          boot_vm() {
            local serial_log=$1
            rm -f work/qemu.pid
            qemu-system-x86_64 \
              "${ACCEL[@]}" \
              -machine pc \
              -m 2048M -smp 2 \
              -drive file=work/fedora44-minimal.qcow2,if=virtio,format=qcow2,cache=writeback \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
              -device virtio-net-pci,netdev=net0 \
              -device virtio-rng-pci \
              -display none -serial "file:$serial_log" -monitor none \
              -no-reboot -daemonize -pidfile work/qemu.pid
            for i in $(seq 1 360); do
              if nc -z 127.0.0.1 2222; then return 0; fi
              if ! kill -0 "$(cat work/qemu.pid)" 2>/dev/null; then
                tail -200 "$serial_log" || true
                return 1
              fi
              sleep 2
            done
            tail -200 "$serial_log" || true
            return 1
          }
          SSH=(ssh -i work/credentials/fedora_minimal_ed25519 -p 2222 \
            -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
            fedora@127.0.0.1)

          boot_vm work/logs/boot-1-console.log
          FIRST_BOOT_ID=$("${SSH[@]}" 'cat /proc/sys/kernel/random/boot_id')
          "${SSH[@]}" 'set -e
            cat /etc/fedora-release
            cat /etc/os-release
            uname -r
            id
            test "$(systemctl get-default)" = multi-user.target
            rpm -q fedora-release-identity-basic
            ! rpm -q fedora-release-server
            ! rpm -q fedora-release-identity-server
            ! rpm -q fedora-release-cloud
            ! rpm -q fedora-release-identity-cloud
            command -v rpm
            command -v dnf5
            dnf5 --version
            test "$(getenforce)" = Enforcing
            test "$(cat /sys/fs/selinux/enforce)" = 1
            rpm -q selinux-policy-targeted
            ! command -v rpm-ostree
            ! rpm -q rpm-ostree
            ! rpm -q cloud-init
            for p in gnome-shell gdm plasma-desktop sddm xorg-x11-server-Xorg; do ! rpm -q "$p"; done
            systemctl is-active sshd
            systemctl is-enabled sshd
            test -f /var/tmp/fedora-minimal-install-marker
            sudo sh -c "printf persistence-test-ok\\n > /var/tmp/fedora-minimal-persistence-marker"
            findmnt /
            df -h /
            rpm -qa | sort > /tmp/installed-rpms.txt
            wc -l /tmp/installed-rpms.txt
          ' | tee transfer/manifest/FIRST-BOOT-VERIFICATION.txt
          printf '%s\n' "$FIRST_BOOT_ID" > transfer/manifest/FIRST-BOOT-ID
          "${SSH[@]}" 'sudo systemctl poweroff' || true
          for i in $(seq 1 180); do
            if ! kill -0 "$(cat work/qemu.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          ! kill -0 "$(cat work/qemu.pid)" 2>/dev/null
          qemu-img check work/fedora44-minimal.qcow2 \
            | tee transfer/manifest/POST-FIRST-BOOT-CHECK.txt

          boot_vm work/logs/boot-2-console.log
          SECOND_BOOT_ID=$("${SSH[@]}" 'cat /proc/sys/kernel/random/boot_id')
          test "$FIRST_BOOT_ID" != "$SECOND_BOOT_ID"
          "${SSH[@]}" 'set -e
            cat /etc/fedora-release
            test "$(systemctl get-default)" = multi-user.target
            rpm -q fedora-release-identity-basic
            ! rpm -q fedora-release-server
            ! rpm -q fedora-release-identity-server
            ! rpm -q fedora-release-cloud
            ! rpm -q fedora-release-identity-cloud
            command -v dnf5
            test "$(getenforce)" = Enforcing
            ! command -v rpm-ostree
            ! rpm -q cloud-init
            for p in gnome-shell gdm plasma-desktop sddm xorg-x11-server-Xorg; do ! rpm -q "$p"; done
            test "$(cat /var/tmp/fedora-minimal-persistence-marker)" = persistence-test-ok
            systemctl is-active sshd
          ' | tee transfer/manifest/SECOND-BOOT-VERIFICATION.txt
          printf '%s\n' "$SECOND_BOOT_ID" > transfer/manifest/SECOND-BOOT-ID
          "${SSH[@]}" 'sudo systemctl poweroff' || true
          for i in $(seq 1 180); do
            if ! kill -0 "$(cat work/qemu.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          ! kill -0 "$(cat work/qemu.pid)" 2>/dev/null
          qemu-img check work/fedora44-minimal.qcow2 \
            | tee transfer/manifest/FINAL-QEMU-IMG-CHECK.txt
          cp work/logs/boot-1-console.log work/logs/boot-2-console.log \
            transfer/manifest/

      - name: Compress and split verified Fedora disk
        shell: bash
        run: |
          set -euo pipefail
          qemu-img convert -p -O qcow2 -c \
            work/fedora44-minimal.qcow2 transfer/fedora44-everything-minimal.qcow2
          qemu-img check transfer/fedora44-everything-minimal.qcow2 \
            | tee transfer/manifest/TRANSFER-DISK-CHECK.txt
          qemu-img info --output=json transfer/fedora44-everything-minimal.qcow2 \
            > transfer/manifest/TRANSFER-DISK-INFO.json
          sha256sum transfer/fedora44-everything-minimal.qcow2 \
            > transfer/manifest/DISK.sha256
          split --bytes=450M --numeric-suffixes=0 --suffix-length=2 \
            transfer/fedora44-everything-minimal.qcow2 \
            transfer/parts/fedora44-everything-minimal.qcow2.part-
          sha256sum transfer/parts/* > transfer/manifest/PARTS.sha256
          stat -c '%n %s bytes' transfer/parts/* > transfer/manifest/PARTS.stat
          rm transfer/fedora44-everything-minimal.qcow2

      - name: Build official Debian 13 QEMU package bundle
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/transfer/qemu-debs:/out" \
            debian:trixie-slim bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends --download-only \
                qemu-system-x86 qemu-utils qemu-system-common qemu-system-data \
                seabios ipxe-qemu dpkg-dev
              cp -v /var/cache/apt/archives/*.deb /out/
            '
          (cd transfer/qemu-debs && dpkg-scanpackages . /dev/null > Packages && \
            gzip -9c Packages > Packages.gz && sha256sum *.deb > SHA256SUMS)

      - name: Upload Fedora disk parts
        uses: actions/upload-artifact@v4
        with:
          name: fedora44-everything-minimal-disk-parts
          path: transfer/parts/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Fedora verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedora44-everything-minimal-manifest
          path: transfer/manifest/
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn

      - name: Upload temporary Fedora access key
        uses: actions/upload-artifact@v4
        with:
          name: fedora44-everything-minimal-access-key
          path: work/credentials/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Debian 13 QEMU package bundle
        uses: actions/upload-artifact@v4
        with:
          name: debian13-qemu-offline-repository
          path: transfer/qemu-debs/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
