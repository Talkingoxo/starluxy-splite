name: Build official Debian 13 QEMU offline repository

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - name: Download dependency-complete QEMU packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/qemu-debs
          docker run --rm -v "$PWD/transfer/qemu-debs:/out" \
            debian:trixie-slim bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends --download-only \
                qemu-system-x86 qemu-utils qemu-system-common qemu-system-data \
                seabios ipxe-qemu dpkg-dev
              cp -v /var/cache/apt/archives/*.deb /out/
            '
          docker run --rm -v "$PWD/transfer/qemu-debs:/repo" \
            debian:trixie-slim bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends dpkg-dev gzip
              cd /repo
              dpkg-scanpackages . /dev/null > Packages
              gzip -9c Packages > Packages.gz
              sha256sum *.deb > SHA256SUMS
            '
          du -sh transfer/qemu-debs

      - name: Upload Debian 13 QEMU repository
        uses: actions/upload-artifact@v4
        with:
          name: debian13-qemu-offline-repository
          path: transfer/qemu-debs/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
