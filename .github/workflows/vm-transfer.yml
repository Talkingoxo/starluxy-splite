name: Temporary Debian QEMU package transfer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official Debian 13 QEMU package set
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p transfer/qemu-debs
          docker run --rm \
            -v "$PWD/transfer/qemu-debs:/out" \
            debian:trixie-slim \
            bash -lc '
              set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends --download-only \
                qemu-system-x86 \
                qemu-utils \
                qemu-system-common \
                qemu-system-data \
                seabios \
                ipxe-qemu
              cp -v /var/cache/apt/archives/*.deb /out/
            '
          cd transfer/qemu-debs
          sha256sum -- *.deb > SHA256SUMS
          dpkg-deb -f qemu-system-x86_*.deb Package Version Architecture > QEMU_SYSTEM_X86.txt
          dpkg-deb -f qemu-utils_*.deb Package Version Architecture > QEMU_UTILS.txt
          tar -czf ../debian13-qemu-offline-bundle.tar.gz .
          cd ..
          sha256sum debian13-qemu-offline-bundle.tar.gz > debian13-qemu-offline-bundle.tar.gz.sha256
          du -sh . qemu-debs

      - name: Upload official Debian QEMU bundle
        uses: actions/upload-artifact@v4
        with:
          name: debian13-qemu-offline-bundle
          path: transfer/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
