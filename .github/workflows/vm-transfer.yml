name: Transfer official Debian 13 OpenSSH client

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - name: Download dependency-complete OpenSSH client package set
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p transfer/openssh-debs
          docker run --rm -v "$PWD/transfer/openssh-debs:/out" debian:trixie-slim bash -lc '
            set -euxo pipefail
            apt-get update
            apt-get install -y --no-install-recommends --download-only openssh-client
            cp -v /var/cache/apt/archives/*.deb /out/
          '
          cd transfer/openssh-debs
          sha256sum -- *.deb > SHA256SUMS
          tar -czf ../debian13-openssh-client-offline-bundle.tar.gz .

      - name: Upload verified OpenSSH client bundle
        uses: actions/upload-artifact@v4
        with:
          name: debian13-openssh-client-offline-bundle
          path: transfer/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
