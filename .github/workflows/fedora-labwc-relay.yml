name: Temporary Fedora 44 LABWC Relay

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fedora-labwc-relay.yml'
      - 'fedora-labwc-relay/installed-package-names.txt'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out relay branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fedora-labwc-relay-20260804

      - name: Build complete Fedora 44 LABWC local repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fedora-labwc-relay/work fedora-labwc-relay/output
          mkdir -p fedora-labwc-relay/work fedora-labwc-relay/output

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf5 install -y --setopt=install_weak_deps=False \
                dnf5-plugins rpm tar xz coreutils findutils createrepo_c

              WORK=/work/fedora-labwc-relay/work
              OUT=/work/fedora-labwc-relay/output
              mkdir -p "$WORK/repo/rpms" "$WORK/manifest" "$OUT/parts"

              dnf5 --setopt=install_weak_deps=False download \
                --resolve \
                --alldeps \
                --arch=x86_64 \
                --arch=noarch \
                --destdir="$WORK/repo/rpms" \
                labwc labwc-session

              find "$WORK/repo/rpms" -maxdepth 1 -type f -name "labwc-*.rpm" ! -name "labwc-session-*" | grep -q .
              find "$WORK/repo/rpms" -maxdepth 1 -type f -name "labwc-session-*.rpm" | grep -q .

              createrepo_c "$WORK/repo"
              rpm -qp --qf "%{NAME}\t%{EPOCHNUM}:%{VERSION}-%{RELEASE}\t%{ARCH}\n" \
                "$WORK"/repo/rpms/*.rpm | sort -u > "$WORK/manifest/PACKAGES.tsv"
              sha256sum "$WORK"/repo/rpms/*.rpm > "$WORK/manifest/RPMS.sha256"
              printf "Fedora 44 LABWC offline local repository\n" > "$WORK/manifest/README.txt"
              printf "Requested packages: labwc labwc-session\n" >> "$WORK/manifest/README.txt"
              printf "Weak dependencies: disabled\n" >> "$WORK/manifest/README.txt"
              printf "Resolver mode: dnf5 download --resolve --alldeps\n" >> "$WORK/manifest/README.txt"
              printf "Install by package name from the bundled local repository; do not install every RPM path directly.\n" >> "$WORK/manifest/README.txt"
              printf "RPM count: %s\n" "$(find "$WORK/repo/rpms" -maxdepth 1 -type f -name "*.rpm" | wc -l)" >> "$WORK/manifest/README.txt"

              tar -C "$WORK" -cJf "$OUT/fedora44-labwc-repository.tar.xz" repo manifest
              sha256sum "$OUT/fedora44-labwc-repository.tar.xz" > "$OUT/BUNDLE.sha256"
              split -b 24M -d -a 2 \
                "$OUT/fedora44-labwc-repository.tar.xz" \
                "$OUT/parts/fedora44-labwc-repository.tar.xz.part-"
              sha256sum "$OUT"/parts/* > "$OUT/PARTS.sha256"
              stat -c "%n %s bytes" "$OUT"/parts/* > "$OUT/PARTS.stat"
              rm -f "$OUT/fedora44-labwc-repository.tar.xz"
              cat "$WORK/manifest/README.txt"
              cat "$OUT/PARTS.stat"
            '

          sudo chown -R "$USER:$USER" fedora-labwc-relay/work fedora-labwc-relay/output

      - name: Commit split relay files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fedora-labwc-relay/output
          git commit -m 'Publish temporary Fedora LABWC relay parts [skip ci]'
          git push origin HEAD:fedora-labwc-relay-20260804
