name: MiniMax BIOS Boot Image

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/minimax-bios-boot-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bios-boot-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install GRUB BIOS tooling
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends grub-pc-bin grub-common

      - name: Build standalone El Torito image
        run: |
          set -euxo pipefail
          cat > grub.cfg <<'EOF'
          set timeout=0
          set default=0
          insmod all_video
          insmod serial
          serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
          terminal_input serial
          terminal_output serial
          search --no-floppy --file --set=root /VMLINUX.EFI
          linux /VMLINUX.EFI console=ttyS0,115200n8 rdinit=/init panic=-1 loglevel=4
          initrd /INITRD.IMG
          boot
          EOF

          grub-mkstandalone \
            --format=i386-pc \
            --output=core.img \
            --install-modules='biosdisk iso9660 linux normal search search_fs_file configfile serial terminal all_video echo test part_msdos part_gpt' \
            'boot/grub/grub.cfg=grub.cfg'
          cat /usr/lib/grub/i386-pc/cdboot.img core.img > eltorito.img
          test -s eltorito.img
          sha256sum eltorito.img > eltorito.img.sha256
          file eltorito.img
          ls -lh eltorito.img

      - name: Upload BIOS boot image
        uses: actions/upload-artifact@v4
        with:
          name: minimax-bios-eltorito
          path: |
            eltorito.img
            eltorito.img.sha256
          if-no-files-found: error
          retention-days: 1
