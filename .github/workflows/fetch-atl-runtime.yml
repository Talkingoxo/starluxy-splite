name: Fetch ATL patch tools

on:
  pull_request:
    branches:
      - main
    paths:
      - atl-runtime-trigger.txt
      - .github/workflows/fetch-atl-runtime.yml

permissions:
  contents: read

jobs:
  fetch-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download standalone APKTool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            --output apktool_3.0.2.jar \
            'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar'
          sha256sum apktool_3.0.2.jar > SHA256SUMS
          java -jar apktool_3.0.2.jar --version

      - name: Upload patch tools
        uses: actions/upload-artifact@v4
        with:
          name: atl-apktool-3.0.2
          path: |
            apktool_3.0.2.jar
            SHA256SUMS
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
