name: Fetch ATL patch tools

on:
  pull_request:
    branches:
      - main
    paths:
      - atl-runtime-trigger.txt
      - .github/workflows/fetch-atl-runtime.yml

permissions:
  contents: read

jobs:
  fetch-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download standalone smali tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            --output baksmali-2.5.2.jar \
            'https://github.com/JesusFreke/smali/releases/download/v2.5.2/baksmali-2.5.2.jar'
          curl --fail --location --retry 5 --retry-delay 3 \
            --output smali-2.5.2.jar \
            'https://github.com/JesusFreke/smali/releases/download/v2.5.2/smali-2.5.2.jar'
          sha256sum baksmali-2.5.2.jar smali-2.5.2.jar > SHA256SUMS
          java -jar baksmali-2.5.2.jar --version
          java -jar smali-2.5.2.jar --version

      - name: Upload patch tools
        uses: actions/upload-artifact@v4
        with:
          name: atl-smali-tools-2.5.2
          path: |
            baksmali-2.5.2.jar
            smali-2.5.2.jar
            SHA256SUMS
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
