name: MiniMax Generic Linux Rootfs V2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/minimax-generic-rootfs-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install bootstrap tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap zstd

      - name: Bootstrap and install runtime
        run: |
          set -euxo pipefail
          sudo debootstrap --variant=minbase --arch=amd64 noble rootfs http://archive.ubuntu.com/ubuntu
          sudo tee rootfs/etc/apt/sources.list >/dev/null <<'EOF'
          deb http://archive.ubuntu.com/ubuntu noble main universe
          deb http://archive.ubuntu.com/ubuntu noble-updates main universe
          deb http://security.ubuntu.com/ubuntu noble-security main universe
          EOF
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          sudo chroot rootfs /bin/bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              busybox-static ca-certificates dbus dbus-x11 \
              xvfb openbox wmctrl x11-utils x11vnc \
              novnc websockify nginx \
              python3-minimal python3-websockify \
              fonts-dejavu-core fonts-liberation \
              xdg-utils procps iproute2 isc-dhcp-client \
              libgtk-3-0t64 libnss3 libxss1 libasound2t64 libgbm1 \
              libx11-xcb1 libxkbfile1 libxtst6 libxinerama1 libxrandr2 \
              libxcomposite1 libxdamage1 libxfixes3 libdrm2 \
              libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 \
              libpango-1.0-0 libcairo2 libdbus-1-3 libexpat1 libxcb1 \
              libgl1 libegl1 libfontconfig1 libfreetype6 libsqlite3-0
            apt-get clean
            rm -rf /var/lib/apt/lists/* /usr/share/doc/* /usr/share/man/* /usr/share/info/* /var/cache/apt/*
            mkdir -p /home/minimax /opt/minimax /var/log/minimax /run/dbus
            useradd -M -d /home/minimax -s /bin/sh minimax || true
            chown -R minimax:minimax /home/minimax
          '

      - name: Normalize and verify rootfs
        run: |
          set -euxo pipefail
          sudo rm -f rootfs/etc/resolv.conf
          sudo ln -s ../run/resolv.conf rootfs/etc/resolv.conf
          sudo truncate -s 0 rootfs/etc/machine-id
          echo minimax-appliance | sudo tee rootfs/etc/hostname
          sudo find rootfs -xdev -type f -name '*.pyc' -delete
          sudo chroot rootfs /bin/busybox true
          test -x rootfs/usr/bin/Xvfb
          test -x rootfs/usr/bin/openbox
          test -x rootfs/usr/bin/x11vnc
          test -x rootfs/usr/bin/websockify
          test -x rootfs/usr/sbin/nginx
          test -f rootfs/usr/share/novnc/vnc.html
          sudo du -sh rootfs

      - name: Package rootfs
        run: |
          set -euxo pipefail
          sudo tar --numeric-owner --xattrs --acls --zstd -cf minimax-generic-rootfs.tar.zst -C rootfs .
          sudo chown "$USER:$USER" minimax-generic-rootfs.tar.zst
          sha256sum minimax-generic-rootfs.tar.zst > minimax-generic-rootfs.tar.zst.sha256
          ls -lh minimax-generic-rootfs.tar.zst

      - name: Upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: minimax-generic-rootfs-v2
          path: |
            minimax-generic-rootfs.tar.zst
            minimax-generic-rootfs.tar.zst.sha256
          if-no-files-found: error
          retention-days: 1
